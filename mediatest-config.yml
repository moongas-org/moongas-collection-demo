#mediatestRootdir: .
# Throttle live pytest log output to at most one message per this many seconds
# (warnings and errors are never throttled). Omit or set to 0 to disable.
logThrottleSeconds: 1.0
mediaRootDir: ../
mediascanFilesYamlPath: ../mediascan-files.yml
minimumFilesize: 10000
extsMedia:
  - mp3
  - m4a
extsArt:
  - jpg
  - webp
  - png
  - xcf
extsLyrics:
  - lrc
  - txt
extsMetadata:
  - yml
extsExtra:
  - pdf
libs:
  - mediaPath: /data/Music/
  - mediaPath: /data/MusicOther/
