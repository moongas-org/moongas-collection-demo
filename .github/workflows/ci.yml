name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out moongas-mediascan-go
        uses: actions/checkout@v4
        with:
          repository: 'moongas-org/moongas-mediascan-go'
          path: 'moongas-mediascan-go'

      - name: Check out moongas-mediascan-python
        uses: actions/checkout@v4
        with:
          repository: 'moongas-org/moongas-mediascan-python'
          path: 'moongas-mediascan-python'

      - name: Check out moongas-mediatest-python-pytest
        uses: actions/checkout@v4
        with:
          repository: 'moongas-org/moongas-mediatest-python-pytest'
          path: 'moongas-mediatest-python-pytest'

      - name: Check out moongas-mediascripts-python
        uses: actions/checkout@v4
        with:
          repository: 'moongas-org/moongas-mediascripts-python'
          path: 'moongas-mediascripts-python'

      - name: Check out moongas-mediatunes-svc-python-blacksheep
        uses: actions/checkout@v4
        with:
          repository: 'moongas-org/moongas-mediatunes-svc-python-blacksheep'
          path: 'moongas-mediatunes-svc-python-blacksheep'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build and Install Go Module
        run: |
          cd moongas-mediascan-go
          go install ./...

      - name: Run Go scan-to-db
        run: |
          rm -f "$GITHUB_WORKSPACE/mediascan.db"
          go -C "$GITHUB_WORKSPACE/moongas-mediascan-go" run ./cmd/scan-to-db "$GITHUB_WORKSPACE/mediascan-config.yml" "$GITHUB_WORKSPACE/mediascan.db" "$GITHUB_WORKSPACE"

      - name: Upload mediascan.db artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediascan-db
          path: ${{ github.workspace }}/mediascan.db

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Create Python virtual environment
        run: |
          uv venv --python "$(command -v python)" "$GITHUB_WORKSPACE/.venv"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Local Python Packages
        run: |
          uv pip install pandas-stubs
          uv pip install -e ./moongas-mediascan-python
          uv pip install -e ./moongas-mediatest-python-pytest
          uv pip install -e ./moongas-mediascripts-python
          uv pip install -e ./moongas-mediatunes-svc-python-blacksheep


      - name: Run mediatest on moongas-collection
        run: |
          python -m mediatest --log-level=DEBUG -v -k "not test_album_cover_exists and not test_album_dir_contains_media_files" "$GITHUB_WORKSPACE"
